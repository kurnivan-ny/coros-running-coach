# Credentials come from the environment; nothing secret is stored here.
# Supabase: use the pooler on port 6543, not the direct 5432 connection.
corach:
  target: "{{ env_var('DBT_TARGET', 'prod') }}"
  outputs:
    prod:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '6543') | int }}"
      user: "{{ env_var('PGUSER', 'postgres') }}"
      password: "{{ env_var('PGPASSWORD', '') }}"
      dbname: "{{ env_var('PGDATABASE', 'postgres') }}"
      schema: "{{ env_var('PGSCHEMA', 'public') }}"
      threads: 2
      sslmode: require
      keepalives_idle: 0
