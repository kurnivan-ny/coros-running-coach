version: 2

sources:
  - name: corach
    description: >
      Tables written by the Python ingestion pipeline. dbt only READS these:
      bronze and silver remain owned by src/corach/ingest.py, because they
      involve schema rejection, quarantine with reasons, and payload hashing
      that a SELECT models poorly.
    schema: "{{ env_var('PGSCHEMA', 'public') }}"
    tables:
      - name: silver_activities
        description: Typed, validated activities. One row per activity.
        columns:
          - name: activity_id
            description: Primary key from the source system.
            data_tests: [unique, not_null]
          - name: start_date_utc
            description: UTC calendar date of the activity start.
            data_tests: [not_null]
          - name: distance_m
            description: Metres. Validated > 0 before reaching silver.
            data_tests: [not_null]
          - name: duration_s
            description: Seconds. Validated > 0 before reaching silver.
            data_tests: [not_null]
          - name: avg_hr
            description: >
              Beats per minute, or NULL when the run reported no heart rate.
              NULL is meaningful and must never be coalesced to 0.
      - name: ops_pipeline_runs
        description: One row per ingestion run; used for the freshness model.
        columns:
          - name: run_id
            data_tests: [unique, not_null]
