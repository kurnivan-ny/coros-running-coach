version: 2

models:
  - name: gold_weekly_volume
    description: >
      Per-ISO-week volume, Monday start, including weeks with no runs.
      Zero-run weeks carry 0 km with NULL pace and NULL HR.
    columns:
      - name: week_start
        description: Monday of the ISO week (UTC).
        data_tests: [unique, not_null]
      - name: runs
        data_tests: [not_null]
      - name: distance_km
        description: 0 for a week with no runs; never NULL.
        data_tests: [not_null]
      - name: pace_s_per_km
        description: >
          NULL for a week with no distance. Deliberately nullable -- a NOT NULL
          test here would be wrong and would force a fabricated zero.
      - name: avg_hr
        description: >
          Duration-weighted over runs reporting HR. NULL when none did.
      - name: week_over_week_pct
        description: NULL for the first week and after any zero-km week.

  - name: gold_training_load
    description: Trailing 7/28/90-day rolling windows.
    columns:
      - name: days
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [7, 28, 90]
      - name: sufficient_history
        description: False when history is shorter than the window.
        data_tests: [not_null]
      - name: distance_km
        data_tests: [not_null]

  - name: gold_pipeline_health
    description: Single-row freshness and reliability summary.
    columns:
      - name: is_fresh
        description: False when no run has ever succeeded.
        data_tests: [not_null]
      - name: total_runs
        data_tests: [not_null]
