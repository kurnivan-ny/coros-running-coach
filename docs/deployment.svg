<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="All-free deployment: GitHub Actions on a schedule runs ingestion and dbt build against Neon Postgres; Streamlit Community Cloud reads Neon through the pooled endpoint and calls a hosted LLM over https. Neon compute sleeps after 5 minutes and wakes on connect; Streamlit sleeps after 12 hours and wakes on visit; neither needs manual intervention, unlike Supabase which pauses after 7 days and must be unpaused by hand.">
  <title>All-free deployment topology</title>
  <defs>
    <marker id="d-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="d-ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/>
    </marker>
  </defs>

  <!-- GitHub Actions -->
  <rect x="20" y="30" width="210" height="104" rx="6" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="36" y="53" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#6b7280">GitHub Actions</text>
  <text x="36" y="72" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">scheduled (cron)</text>
  <text x="36" y="93" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">&#8226; corach.ingest (daily)</text>
  <text x="36" y="127" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">2,000 min/mo private &#183; free if public</text>

  <!-- Neon -->
  <rect x="300" y="30" width="200" height="104" rx="6" fill="none" stroke="#166534" stroke-width="1.5"/>
  <text x="316" y="53" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#166534">Neon Postgres</text>
  <text x="316" y="72" font-family="system-ui,sans-serif" font-size="11" fill="#166534">bronze / silver / gold</text>
  <text x="316" y="91" font-family="system-ui,sans-serif" font-size="11" fill="#166534">1 GB storage, free</text>
  <text x="316" y="112" font-family="system-ui,sans-serif" font-size="11" fill="#166534">sleeps after 5 min &#8594;</text>
  <text x="316" y="127" font-family="system-ui,sans-serif" font-size="11" fill="#166534">wakes automatically</text>

  <line x1="230" y1="82" x2="300" y2="82" stroke="#6b7280" stroke-width="1.5" marker-end="url(#d-ar)"/>
  <text x="265" y="75" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">writes</text>

  <!-- Streamlit -->
  <rect x="300" y="210" width="200" height="94" rx="6" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="316" y="233" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#6b7280">Streamlit Cloud</text>
  <text x="316" y="252" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">dashboard + chat</text>
  <text x="316" y="273" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">sleeps after ~12 h &#8594;</text>
  <text x="316" y="288" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">wakes on visit</text>

  <line x1="400" y1="210" x2="400" y2="134" stroke="#166534" stroke-width="1.5" marker-end="url(#d-ar-green)"/>
  <text x="410" y="166" font-family="system-ui,sans-serif" font-size="11" fill="#166534">reads only, via the</text>
  <text x="410" y="181" font-family="system-ui,sans-serif" font-size="11" fill="#166534">-pooler endpoint</text>

  <!-- LLM -->
  <rect x="560" y="210" width="180" height="94" rx="6" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="576" y="233" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#6b7280">Hosted LLM</text>
  <text x="576" y="252" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">Ollama Cloud or</text>
  <text x="576" y="267" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">Cloudflare Workers AI</text>
  <text x="576" y="288" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">optional &#8212; phrasing only</text>

  <line x1="500" y1="257" x2="560" y2="257" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#d-ar)"/>
  <text x="530" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">https</text>
  <text x="530" y="276" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">aggregates</text>

  <!-- Viewer -->
  <rect x="20" y="210" width="210" height="94" rx="6" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="36" y="233" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#6b7280">You</text>
  <text x="36" y="252" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">browser</text>
  <text x="36" y="273" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">Public apps are world-readable.</text>
  <text x="36" y="288" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">Real data &#8594; the 1 private app.</text>

  <line x1="230" y1="257" x2="300" y2="257" stroke="#6b7280" stroke-width="1.5" marker-end="url(#d-ar)"/>
  <text x="265" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">visit</text>

  <!-- The contrast that drives the choice -->
  <rect x="20" y="344" width="720" height="76" rx="6" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="36" y="367" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#b91c1c">Why Neon and not Supabase on a free tier</text>
  <text x="36" y="388" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">Supabase free pauses the whole project after 7 days idle and needs a manual dashboard click to return,</text>
  <text x="36" y="405" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">so the scheduled job becomes life support. Neon only sleeps compute and wakes itself on the next connection.</text>
</svg>
