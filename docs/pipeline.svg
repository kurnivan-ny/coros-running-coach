<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" width="780" height="640" role="img" aria-label="Data flow: COROS data is saved from a Claude session as text snapshots; Python ingestion upserts raw payloads into bronze in Neon only when the payload hash changes; dbt builds silver (typed, validated rows, with rejects quarantined with a reason) and gold (activities with load, daily load, weekly summary); whitelisted read-only tools, a deterministic coach and an optional number-guarded LLM feed the Streamlit dashboard.">
  <title>COROS coach data pipeline</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <g font-family="system-ui,sans-serif">

  <!-- Source -->
  <rect x="20" y="16" width="330" height="62" rx="6" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="36" y="38" font-size="13" font-weight="600" fill="#6b7280">COROS (via a Claude session)</text>
  <text x="36" y="56" font-size="11" fill="#6b7280">querySportRecords saved as data/coros_raw/*.txt (gitignored)</text>
  <text x="36" y="70" font-size="11" fill="#6b7280">SyntheticSource for demos and CI</text>

  <line x1="185" y1="78" x2="185" y2="112" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="195" y="100" font-size="11" fill="#6b7280">coros_record_v1 payloads</text>

  <!-- Python -->
  <rect x="20" y="112" width="500" height="74" rx="6" fill="none" stroke="#a16207" stroke-width="1.5"/>
  <text x="36" y="134" font-size="13" font-weight="600" fill="#a16207">BRONZE &#8212; Python (corach.ingest) &#8594; bronze_activities in Neon</text>
  <text x="36" y="153" font-size="11" fill="#a16207">raw JSON + payload_hash; upsert ONLY when the hash changes, so a rerun writes nothing</text>
  <text x="36" y="168" font-size="11" fill="#a16207">watermark + 3-day overlap, retry on transient errors, every run logged</text>

  <line x1="185" y1="186" x2="185" y2="228" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="195" y="212" font-size="11" fill="#6b7280">dbt build (GitHub Actions, free) &#8212; models + tests</text>

  <!-- Silver -->
  <rect x="20" y="228" width="250" height="84" rx="6" fill="none" stroke="#0e7490" stroke-width="1.5"/>
  <text x="36" y="250" font-size="13" font-weight="600" fill="#0e7490">SILVER &#8212; dbt</text>
  <text x="36" y="268" font-size="11" fill="#0e7490">silver_activities: typed, validated,</text>
  <text x="36" y="283" font-size="11" fill="#0e7490">all sports, missing HR stays NULL</text>
  <text x="36" y="298" font-size="11" fill="#0e7490">bronze = silver + rejects (tested)</text>

  <rect x="300" y="228" width="220" height="84" rx="6" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="316" y="250" font-size="13" font-weight="600" fill="#b91c1c">silver_rejects</text>
  <text x="316" y="268" font-size="11" fill="#b91c1c">quarantine + failure reason</text>
  <text x="316" y="283" font-size="11" fill="#b91c1c">never reaches the metrics</text>
  <line x1="270" y1="270" x2="300" y2="270" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ar-red)"/>

  <line x1="145" y1="312" x2="145" y2="350" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Gold -->
  <rect x="20" y="350" width="500" height="92" rx="6" fill="none" stroke="#166534" stroke-width="1.5"/>
  <text x="36" y="372" font-size="13" font-weight="600" fill="#166534">GOLD &#8212; dbt (schema gold)</text>
  <text x="36" y="391" font-size="11" fill="#166534">fct_activities: one row per activity + TRIMP load</text>
  <text x="36" y="406" font-size="11" fill="#166534">daily_load: gap-free days, acute / chronic load, ACWR, monotony, strain</text>
  <text x="36" y="421" font-size="11" fill="#166534">weekly_summary: ISO week x sport (volume, pace, HR, load)</text>
  <text x="36" y="436" font-size="11" fill="#166534">reconciliation tests: weekly and daily totals must equal fct_activities</text>

  <!-- Ops -->
  <rect x="560" y="112" width="200" height="200" rx="6" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="576" y="134" font-size="13" font-weight="600" fill="#6b7280">ops_pipeline_runs</text>
  <text x="576" y="156" font-size="11" fill="#6b7280">status, row counts,</text>
  <text x="576" y="171" font-size="11" fill="#6b7280">watermark, error</text>
  <text x="576" y="195" font-size="11" fill="#6b7280">A failure is logged,</text>
  <text x="576" y="210" font-size="11" fill="#6b7280">then re-raised so the</text>
  <text x="576" y="225" font-size="11" fill="#6b7280">CLI exits 1.</text>
  <text x="576" y="249" font-size="11" fill="#6b7280">Freshness = age of the</text>
  <text x="576" y="264" font-size="11" fill="#6b7280">last SUCCESSFUL ingest.</text>
  <line x1="520" y1="149" x2="560" y2="149" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <!-- Serving -->
  <line x1="145" y1="442" x2="145" y2="478" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="20" y="478" width="740" height="70" rx="6" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="36" y="500" font-size="12" fill="#6b7280"><tspan font-weight="600">coach/tools.py</tspan> &#8212; 9 whitelisted, read-only tools; fixed SQL, bounded arguments, no model-written SQL</text>
  <text x="36" y="519" font-size="12" fill="#6b7280">&#8594; <tspan font-weight="600">coach/plan.py</tspan> (rule-based weekly plan)  &#8594; <tspan font-weight="600">coach/chat.py</tspan> (router, deterministic answers, number guard)</text>
  <text x="36" y="538" font-size="12" fill="#6b7280">&#8594; <tspan font-weight="600">app.py</tspan> &#8212; Streamlit + Plotly, 8 tabs, reads gold from Neon</text>

  <line x1="145" y1="548" x2="145" y2="580" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="20" y="580" width="740" height="44" rx="6" fill="none" stroke="#166534" stroke-width="1.5"/>
  <text x="36" y="607" font-size="12" fill="#166534">An optional LLM (Claude API, hosted free tier, or local Ollama) may only <tspan font-weight="600">rephrase</tspan> verified facts. Any number not in them is rejected.</text>

  </g>
</svg>
